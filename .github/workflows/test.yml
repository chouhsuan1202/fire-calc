name: 測試

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: 計算核心單元測試與參考案例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 單元測試
        run: node tests/fire-core.test.js
      - name: 重新產生參考案例，確認跟提交的檔案一致
        run: |
          python3 tests/reference.py
          git diff --exit-code tests/fixtures/reference-cases.json

  ui:
    name: 畫面層測試（Chromium）
    runs-on: ubuntu-latest
    env:
      REQUIRE_UI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝 Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: 畫面層測試
        run: node tests/ui.test.js
